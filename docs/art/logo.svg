<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B2B2B"/>
      <stop offset="100%" style="stop-color:#3C3F41"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background - IDE dark theme colors -->
  <rect width="200" height="200" rx="45" fill="url(#bgGrad)"/>
  
  <!-- Bracket style representing delegation -->
  <g fill="none" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.8">
    <!-- Left bracket [ -->
    <path d="M 45 60 L 35 60 L 35 140 L 45 140"/>
  </g>
  
  <!-- "by" text in center - using IDE orange color -->
  <text x="100" y="115" 
        font-family="monospace" 
        font-size="70" 
        font-weight="bold" 
        fill="#FF9800" 
        text-anchor="middle"
        letter-spacing="0"
        direction="ltr"
        unicode-bidi="bidi-override">by</text>
  
  <!-- Right bracket ] -->
  <g fill="none" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.8">
    <path d="M 155 60 L 165 60 L 165 140 L 155 140"/>
  </g>
  
  <!-- "X" integrated as superscript -->
  <text x="175" y="50" 
        font-family="'JetBrains Mono', monospace" 
        font-size="40" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">X</text>
</svg>
